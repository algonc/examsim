name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Check for data races
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

  build:
    name: Package binaries
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf 'Invalid release tag: %s. Expected vMAJOR.MINOR.PATCH or a prerelease such as v1.0.0-rc.1.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and archive each platform
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin/release
          for target_os in linux darwin windows; do
            for target_arch in amd64 arm64; do
              asset_name="examsim_${RELEASE_TAG}_${target_os}_${target_arch}"
              staging_dir="$RUNNER_TEMP/$asset_name"
              binary_name=examsim
              if [[ "$target_os" == windows ]]; then
                binary_name=examsim.exe
              fi

              mkdir -p "$staging_dir/examples"
              GOOS="$target_os" GOARCH="$target_arch" go build \
                -trimpath -ldflags='-s -w' -o "$staging_dir/$binary_name" .
              cp LICENSE README.md "$staging_dir/"
              cp examples/exam1.yaml "$staging_dir/examples/"

              if [[ "$target_os" == windows ]]; then
                (
                  cd "$staging_dir"
                  zip -q -r "$GITHUB_WORKSPACE/bin/release/$asset_name.zip" \
                    "$binary_name" LICENSE README.md examples
                )
              else
                tar -czf "bin/release/$asset_name.tar.gz" -C "$staging_dir" \
                  "$binary_name" LICENSE README.md examples
              fi
            done
          done

      - name: Generate SHA-256 checksums
        working-directory: bin/release
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: bin/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: bin/release

      - name: Verify release assets
        working-directory: bin/release
        run: sha256sum --check checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_args+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "examsim $RELEASE_TAG" \
            "${prerelease_args[@]}" \
            bin/release/*.tar.gz bin/release/*.zip bin/release/checksums.txt
